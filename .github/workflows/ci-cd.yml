name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Check model file size
      run: ls -lh models/RandomForest.pkl

    - name: Checkout repo
      uses: actions/checkout@v3
      with:
        lfs: true

    - name: Pull LFS files
      run: git lfs pull

    - name: Run basic test (import check)
      run: |
        python -c "import src.api.app"


    # Run API tests
    - name: Run API tests
      env:
        PYTHONPATH: .
      run: |
        pytest

    - name: Build Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/energy_api:latest .

    - name: Push Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/energy-api:latest
